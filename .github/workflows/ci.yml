name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Install apt toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lua5.4 tcl
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Install Kotlin
        run: |
          base="https://github.com/JetBrains/kotlin/releases/download"
          ver="v2.2.20"
          curl -sSL "$base/$ver/kotlin-compiler-$ver.zip" -o /tmp/kotlin.zip
          sudo mkdir -p /opt/kotlin
          sudo unzip -q /tmp/kotlin.zip -d /opt/kotlin
          echo "/opt/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Dart
        run: |
          base="https://storage.googleapis.com/dart-archive"
          path="/channels/stable/release/latest/sdk/dartsdk-linux-x64-release.zip"
          curl -sSL "$base$path" -o /tmp/dart.zip
          sudo mkdir -p /opt/dart
          sudo unzip -q /tmp/dart.zip -d /opt/dart
          echo "/opt/dart/dart-sdk/bin" >> "$GITHUB_PATH"
      - name: Install Swift
        run: |
          base="https://download.swift.org/swift-6.1-release/ubuntu2404"
          path="/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu24.04.tar.gz"
          curl -sSL "$base$path" -o /tmp/swift.tgz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Install PowerShell
        env:
          PWSH_VERSION: 7.4.6
        run: |
          curl -sSL -o /tmp/pwsh.tgz \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz"
          sudo mkdir -p /opt/powershell
          sudo tar zxf /tmp/pwsh.tgz -C /opt/powershell
          sudo chmod +x /opt/powershell/pwsh
          sudo ln -s /opt/powershell/pwsh /usr/local/bin/pwsh
      - name: Install CBQN
        run: |
          git clone --depth 1 https://github.com/dzaima/CBQN /tmp/CBQN
          make -C /tmp/CBQN -j"$(nproc)"
          sudo cp /tmp/CBQN/BQN /usr/local/bin/bqn
      - name: Run test vectors
        run: python3 tests/run_tests.py
