name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install PowerShell
        env:
          PWSH_VERSION: 7.4.6
        run: |
          curl -sSL -o /tmp/pwsh.tgz \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz"
          sudo mkdir -p /opt/powershell
          sudo tar zxf /tmp/pwsh.tgz -C /opt/powershell
          sudo chmod +x /opt/powershell/pwsh
          sudo ln -s /opt/powershell/pwsh /usr/local/bin/pwsh
      - name: Install CBQN
        run: |
          git clone --depth 1 https://github.com/dzaima/CBQN /tmp/CBQN
          make -C /tmp/CBQN -j"$(nproc)"
          sudo cp /tmp/CBQN/BQN /usr/local/bin/bqn
      - name: Run test vectors
        run: python3 tests/run_tests.py
